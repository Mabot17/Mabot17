<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gold Linear Gradient -->
    <linearGradient id="intiGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF3CD"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA820A"/>
      <stop offset="100%" stop-color="#785B00"/>
    </linearGradient>

    <!-- Warm Radiant Core Gradient -->
    <radialGradient id="intiCoreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F9E8A2"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6805"/>
    </radialGradient>

    <!-- Subtle Golden Glow Filter -->
    <filter id="intiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Orbit Ring (Subtle Sacred Geometry) -->
  <circle cx="100" cy="100" r="74" fill="none" stroke="url(#intiGoldGrad)" stroke-width="1" stroke-dasharray="3 4" opacity="0.38"/>

  <!-- Peripheral Interconnection Lines between outer nodes -->
  <g stroke="url(#intiGoldGrad)" stroke-width="1.2" opacity="0.25" stroke-dasharray="2 3">
    <line x1="60" y1="40" x2="140" y2="50"/>
    <line x1="140" y1="50" x2="160" y2="110"/>
    <line x1="160" y1="110" x2="140" y2="160"/>
    <line x1="140" y1="160" x2="60" y2="150"/>
    <line x1="60" y1="150" x2="30" y2="90"/>
    <line x1="30" y1="90" x2="60" y2="40"/>
  </g>

  <!-- Connection Rays / Interkoneksi Lines -->
  <g stroke="url(#intiGoldGrad)" stroke-width="2.2" opacity="0.8" stroke-linecap="round">
    <line x1="100" y1="100" x2="60" y2="40"/>
    <line x1="100" y1="100" x2="140" y2="50"/>
    <line x1="100" y1="100" x2="160" y2="110"/>
    <line x1="100" y1="100" x2="140" y2="160"/>
    <line x1="100" y1="100" x2="60" y2="150"/>
    <line x1="100" y1="100" x2="30" y2="90"/>
  </g>

  <!-- Outer Satellites / Nodes -->
  <g fill="url(#intiGoldGrad)" filter="url(#intiGlow)">
    <circle cx="60" cy="40" r="7"/>
    <circle cx="140" cy="50" r="7"/>
    <circle cx="160" cy="110" r="7"/>
    <circle cx="140" cy="160" r="7"/>
    <circle cx="60" cy="150" r="7"/>
    <circle cx="30" cy="90" r="7"/>
  </g>

  <!-- Inner Sparkle dots on nodes -->
  <g fill="#FFFFFF" opacity="0.95">
    <circle cx="58" cy="38" r="1.8"/>
    <circle cx="138" cy="48" r="1.8"/>
    <circle cx="158" cy="108" r="1.8"/>
    <circle cx="138" cy="158" r="1.8"/>
    <circle cx="58" cy="148" r="1.8"/>
    <circle cx="28" cy="88" r="1.8"/>
  </g>

  <!-- Core Outer Halo Ring -->
  <circle cx="100" cy="100" r="21" fill="none" stroke="url(#intiGoldGrad)" stroke-width="1.5" opacity="0.45"/>

  <!-- Central Core / INTI -->
  <circle cx="100" cy="100" r="14" fill="url(#intiCoreGrad)" filter="url(#intiGlow)"/>
  <circle cx="96.5" cy="96.5" r="3.5" fill="#FFFFFF" opacity="0.95"/>
</svg>